<!DOCTYPE html>
<html>
<head>
    <title>Student Admission Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 450px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px gray;
        }

        h1 {
            text-align: center;
            color: #2455a4;
        }

        h3 {
            color: #2455a4;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 70px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2455a4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #163b78;
        }

        .reset {
            background: #777;
            margin-top: 10px;
        }

        #message {
            text-align: center;
            color: green;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Admission Form</h1>

    <form id="admissionForm">

        <h3>Student Details</h3>

        <label>Student Name:</label>
        <input type="text" id="name" placeholder="Enter student name" required>

        <label>Date of Birth:</label>
        <input type="date" id="dob" required>

        <label>Gender:</label>
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter email" required>

        <label>Phone Number:</label>
        <input type="tel" id="phone" placeholder="Enter phone number"
               pattern="[0-9]{10}" maxlength="10" required>

        <label>Address:</label>
        <textarea id="address" placeholder="Enter address" required></textarea>

        <h3>Parent Details</h3>

        <label>Father's Name:</label>
        <input type="text" id="father" required>

        <label>Mother's Name:</label>
        <input type="text" id="mother" required>

        <h3>Academic Details</h3>

        <label>Select Course:</label>
        <select id="course" required>
            <option value="">Select Course</option>
            <option>B.Tech</option>
            <option>B.Sc</option>
            <option>B.Com</option>
            <option>BBA</option>
            <option>MCA</option>
            <option>MBA</option>
        </select>

        <label>Previous Qualification:</label>
        <input type="text" id="qualification"
               placeholder="Enter qualification" required>

        <label>Percentage:</label>
        <input type="number" id="percentage"
               min="0" max="100" placeholder="Enter percentage" required>

        <button type="submit">Submit Application</button>

        <button type="reset" class="reset">Reset</button>

    </form>

    <div id="message"></div>

</div>

<script>

    document.getElementById("admissionForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        let name = document.getElementById("name").value;
        let course = document.getElementById("course").value;
        let email = document.getElementById("email").value;

        document.getElementById("message").innerHTML =
            "Admission Application Submitted Successfully!<br><br>" +
            "Student Name: " + name + "<br>" +
            "Selected Course: " + course + "<br>" +
            "Email: " + email;

    });

</script>

</body>
</html>
